<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LSCSD | Система подачи заявок</title>
    <link rel="icon" type="image/png" href="image.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        :root { 
            --bg: #05070a; --card: #0d1117; --accent: #d4a373; 
            --border: rgba(255, 255, 255, 0.08); --text: #f1f3f5; --text-dim: #8b949e; 
            --input-bg: #010409; --opt-bg: rgba(255,255,255,0.03);
        }

        [data-theme="light"] {
            --bg: #f0f2f5; --card: #ffffff; --accent: #b5895b; 
            --border: rgba(0, 0, 0, 0.1); --text: #1a1d23; --text-dim: #65676b;
            --input-bg: #fdfdfd; --opt-bg: #eeeeee;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
        
        #preloader { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; transition: 0.5s; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #page-login { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .login-card { background: var(--card); padding: 50px; border-radius: 20px; border: 1px solid var(--border); width: 90%; max-width: 450px; text-align: center; }

        header { display: none; justify-content: space-between; align-items: center; padding: 0 40px; height: 80px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .brand img { height: 45px; cursor: pointer; }
        
        .container { display: none; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .form-box { background: var(--card); padding: 40px; border-radius: 12px; border: 1px solid var(--border); }

        label { display: block; font-size: 0.75rem; color: var(--accent); font-weight: 900; text-transform: uppercase; margin: 25px 0 12px; letter-spacing: 2px; }
        .u-input { width: 100%; min-height: 55px; padding: 18px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); outline: none; transition: 0.3s; user-select: text; }

        /* ФИКС КНОПОК ДЛЯ ТЕМНОЙ ТЕМЫ */
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
        .opt-btn { 
            padding: 12px 25px; background: var(--input-bg); border: 1px solid var(--border); 
            border-radius: 8px; color: var(--text); cursor: pointer; font-weight: 700; 
            transition: 0.2s; min-width: 80px; text-align: center;
        }
        .opt-btn:hover { border-color: var(--accent); }
        .opt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3); }

        .btn-main { background: var(--accent); color: #fff; width: 100%; padding: 20px; border-radius: 10px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 20px; letter-spacing: 2px; }
        .btn-discord { background: #5865F2; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; }
        .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 15px; font-size: 0.7rem; border-radius: 8px; cursor: pointer; font-weight: 900; text-transform: uppercase; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card); padding: 40px 20px; border-radius: 15px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .page { display: none; }
        .active-page { display: block; }
        .toast { position: fixed; top: 20px; right: 20px; background: var(--card); border-left: 4px solid var(--accent); color: var(--text); padding: 18px 25px; border-radius: 8px; z-index: 10000; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="preloader">
        <div class="spinner"></div>
        <div style="font-weight: 900; letter-spacing: 3px; color: var(--accent); font-size: 0.8rem;">LOADING SYSTEM</div>
    </div>

    <div id="page-login">
        <div class="login-card">
            <img src="image.png" alt="LSCSD" style="width:120px; margin-bottom:20px;">
            <h1 style="font-weight:900; margin-bottom:10px;">LSCSD PORTAL</h1>
            <p style="color:var(--text-dim); margin-bottom:30px;">Авторизуйтесь для доступа</p>
            <button class="btn-main btn-discord" onclick="login()">Discord Login</button>
        </div>
    </div>

    <header id="ui-header">
        <div class="brand" onclick="showPage('page-home')"><img src="image.png"></div>
        <div style="display:flex; align-items:center; gap:12px;">
            <button class="btn-ghost" onclick="toggleTheme()">🌓 Тема</button>
            <div id="adm-btn-wrap"></div>
            <img id="u-ava" style="width:38px; height:38px; border-radius:50%; border:2px solid var(--accent);">
            <button onclick="logout()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-weight:900;">✕</button>
        </div>
    </header>

    <div class="container" id="main-container">
        <div id="page-home" class="page active-page">
            <h2 style="margin-bottom:30px; font-weight:900;">Доступные заявки</h2>
            <div id="grid-main" class="grid"></div>
        </div>
        <div id="page-apply" class="page">
            <div class="form-box">
                <button onclick="showPage('page-home')" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:900; margin-bottom:20px;">← НАЗАД</button>
                <h2 id="apply-title" style="font-weight:900;"></h2>
                <div id="apply-fields"></div>
                <button id="submit-btn" class="btn-main" onclick="submitApplication()">ОТПРАВИТЬ</button>
            </div>
        </div>
        <div id="page-admin" class="page">
             <div id="admin-editor" class="form-box">Перейдите в категорию для редактирования</div>
        </div>
    </div>
    <div id="toast-container"></div>

<script>
    // 1. ЗАЩИЩЕННЫЙ КОНФИГ (ЗАПУСКАЕТСЯ ПЕРВЫМ)
    (function() {
        const _0xdata = {
            fb: "aHR0cHM6Ly9sc2NzZC1wb3J0YWwxMy1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20v",
            wh: "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTQ5NzUxMTMxMTEwNDQwOTcxMi9aZk9tank5ektFdjFOYVZaZWJOY2VsSmUzbVY2aXdMakhhUG9hcTRBYnhiaHRMN19lUmRESnh4MHpKbHdEYkwxbGZuMw=="
        };
        const decode = (s) => atob(s);
        window.CONFIG = {
            firebase: { databaseURL: decode(_0xdata.fb) },
            discord: { 
                ownerId: '1097047579876929616', 
                clientId: '1496624504548364448', 
                redirectUri: window.location.origin + '/' 
            },
            webhooks: { logs: decode(_0xdata.wh) }
        };
    })();

    // 2. ИНИЦИАЛИЗАЦИЯ FIREBASE
    firebase.initializeApp(CONFIG.firebase);
    const database = firebase.database();
    let state = { user: null, db: { categories: [], permissions: {} } };

    async function init() {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        let token = new URLSearchParams(window.location.hash.slice(1)).get('access_token') || localStorage.getItem('sd_token');
        
        if (token) {
            localStorage.setItem('sd_token', token);
            window.history.replaceState(null, null, window.location.pathname);
            try {
                const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) throw new Error();
                state.user = await res.json();
                
                document.getElementById('preloader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('preloader').style.display = 'none';
                    document.getElementById('page-login').style.display = 'none';
                    document.getElementById('ui-header').style.display = 'flex';
                    document.getElementById('main-container').style.display = 'block';
                }, 500);

                sync();
            } catch(e) { logout(); }
        } else {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('page-login').style.display = 'flex';
        }
    }

    function sync() {
        database.ref('portal_db').on('value', snap => {
            state.db = snap.val() || { categories: [], permissions: {} };
            renderHome(); 
            renderUI();
        });
    }

    function renderUI() {
        document.getElementById('u-ava').src = `https://cdn.discordapp.com/avatars/${state.user.id}/${state.user.avatar}.png`;
        const isAdm = state.user.id === CONFIG.discord.ownerId || state.db.permissions?.[state.user.id];
        if(isAdm) document.getElementById('adm-btn-wrap').innerHTML = `<button class="btn-ghost" onclick="showPage('page-admin')">⚙️ Админ</button>`;
    }

    function renderHome() {
        const g = document.getElementById('grid-main'); g.innerHTML = '';
        state.db.categories.forEach(c => {
            const d = document.createElement('div'); d.className = 'card';
            d.innerHTML = `<div style="font-size:2.5rem; margin-bottom:10px;">${c.emoji}</div><h3 style="font-weight:800;">${c.name}</h3>`;
            d.onclick = () => openApplyForm(c.id);
            g.appendChild(d);
        });
    }

    function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById(id).classList.add('active-page'); }
    function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CONFIG.discord.clientId}&redirect_uri=${encodeURIComponent(CONFIG.discord.redirectUri)}&response_type=token&scope=identify`; }
    function logout() { localStorage.removeItem('sd_token'); location.reload(); }
    function toggleTheme() {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }

    // Запуск приложения
    window.onload = init;
</script>
</body>
</html>
