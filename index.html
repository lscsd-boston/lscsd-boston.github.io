<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LSCSD Portal</title>
    <link rel="icon" type="image/png" href="image.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg: #03050a;
            --card: #0a0e15;
            --card-hover: #0f141f;
            --accent: #d4a373;
            --accent-light: #e4b98a;
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.1);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --error: #ff4d4d;
            --success: #4ade80;
            --overlay: rgba(0,0,0,0.85);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:var(--bg); color:var(--text); overflow-x:hidden; min-height:100vh; }

        #preloader { position:fixed; inset:0; background:var(--bg); z-index:100000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .loader-logo { width:120px; filter:drop-shadow(0 0 30px var(--accent)); margin-bottom:30px; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .loader-bar { width:200px; height:3px; background:var(--border); border-radius:3px; overflow:hidden; }
        .loader-progress { width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:move 1.5s infinite linear; }
        @keyframes move { from{left:-50%} to{left:110%} }

        header { display:none; justify-content:space-between; align-items:center; padding:0 5%; height:70px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(3,5,10,0.9); backdrop-filter:blur(20px); z-index:999; }
        .header-right { display:flex; align-items:center; gap:10px; }

        .container { display:none; max-width:1200px; margin:0 auto; padding:40px 20px; }
        .page { display:none; animation:fadeIn 0.3s ease; }
        .page.active-page { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }
        .card { background:var(--card); padding:40px 20px; border-radius:20px; border:1px solid var(--border); text-align:center; cursor:pointer; transition:all 0.3s; }
        .card:hover { border-color:var(--accent); transform:translateY(-5px); box-shadow:0 15px 40px rgba(0,0,0,0.3); }
        .card-emoji { font-size:3rem; margin-bottom:12px; }
        .card-title { font-weight:800; text-transform:uppercase; letter-spacing:1px; font-size:0.95rem; }

        .u-input { width:100%; padding:14px 16px; background:var(--bg); border:1px solid var(--border); border-radius:12px; color:var(--text); outline:none; font-size:0.9rem; transition:0.3s; resize:vertical; }
        .u-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(212,163,115,0.1); }
        .u-input.error { border-color:var(--error); }
        textarea.u-input { min-height:80px; }
        input[type="color"].u-input { padding:8px 16px; height:45px; cursor:pointer; }
        select.u-input { appearance:auto; }

        .btn { padding:12px 24px; border-radius:12px; border:none; font-weight:700; cursor:pointer; transition:0.3s; font-size:0.9rem; }
        .btn-accent { background:linear-gradient(135deg,var(--accent),var(--accent-light)); color:#000; }
        .btn-accent:hover { opacity:0.9; transform:translateY(-2px); }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-outline:hover { border-color:var(--accent); }
        .btn-danger { background:var(--error); color:#fff; }
        .btn-sm { padding:8px 14px; font-size:0.75rem; border-radius:8px; }
        .btn-block { width:100%; }
        .btn:disabled { opacity:0.5; pointer-events:none; }

        .opt-btn { padding:16px; background:var(--card); border:2px solid var(--border); border-radius:12px; text-align:center; cursor:pointer; font-weight:700; font-size:0.85rem; transition:0.3s; }
        .opt-btn:hover { border-color:var(--accent); }
        .opt-btn.active { border-color:var(--accent); background:rgba(212,163,115,0.15); color:var(--accent); }

        label { display:block; font-size:0.7rem; color:var(--accent); font-weight:700; text-transform:uppercase; margin:18px 0 6px; letter-spacing:1px; }
        label:first-child { margin-top:0; }

        /* МОДАЛЬНЫЕ ОКНА (формы и админка) */
        .modal-overlay { position:fixed; inset:0; background:var(--overlay); z-index:10000; display:flex; justify-content:center; align-items:center; backdrop-filter:blur(10px); padding:20px; }
        .modal-box { background:var(--card); border:1px solid var(--border-light); padding:35px; border-radius:24px; width:100%; max-width:600px; max-height:85vh; overflow-y:auto; border-top:4px solid var(--accent); box-shadow:0 30px 60px rgba(0,0,0,0.5); animation:modalIn 0.3s ease; }
        .modal-wide { max-width:800px; }
        @keyframes modalIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }

        /* БОКОВОЕ МЕНЮ */
        .sidebar { position:fixed; top:70px; left:0; bottom:0; width:280px; background:var(--card); border-right:1px solid var(--border); z-index:998; overflow-y:auto; padding:30px 20px; transform:translateX(-100%); transition:transform 0.3s ease; }
        .sidebar.open { transform:translateX(0); }
        .sidebar-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:997; display:none; }
        .sidebar-backdrop.show { display:block; }
        .sidebar-item { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; cursor:pointer; transition:0.3s; margin-bottom:5px; font-weight:600; font-size:0.9rem; }
        .sidebar-item:hover { background:var(--card-hover); }
        .sidebar-item.active { background:rgba(212,163,115,0.1); color:var(--accent); }

        .login-page { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-card { background:var(--card); padding:50px 40px; border-radius:30px; border:1px solid var(--border); text-align:center; max-width:420px; width:100%; }
        .login-logo { width:90px; margin-bottom:25px; filter:drop-shadow(0 0 25px var(--accent)); }

        .toast { position:fixed; bottom:30px; right:30px; z-index:99999; padding:14px 22px; border-radius:12px; font-weight:600; animation:slideIn 0.3s; }
        @keyframes slideIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .toast-success { background:var(--success); color:#000; }
        .toast-error { background:var(--error); color:#fff; }

        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:var(--bg); }
        ::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:3px; }
    </style>
</head>
<body>

<div id="preloader">
    <img src="image.png" class="loader-logo">
    <div class="loader-bar"><div class="loader-progress"></div></div>
</div>

<!-- Боковое меню -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar">
    <a class="sidebar-item active" onclick="showPage('page-home');closeSidebar()">🏠 Главная</a>
    <div id="sidebar-admin-items"></div>
</nav>

<!-- Модальное окно для форм и админки -->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box" id="modal-box"></div>
</div>

<div id="page-login" class="login-page" style="display:none;">
    <div class="login-card">
        <img src="image.png" class="login-logo">
        <h2 style="font-weight:900;font-size:1.8rem;margin-bottom:10px;">LSCSD PORTAL</h2>
        <p style="color:var(--text-dim);margin-bottom:30px;">Портал подачи заявок</p>
        <button class="btn btn-block" style="background:#5865F2;color:#fff;font-size:1rem;" onclick="login()">🔐 Войти через Discord</button>
    </div>
</div>

<header id="ui-header">
    <div style="display:flex;align-items:center;gap:15px;">
        <button class="btn btn-outline btn-sm" onclick="openSidebar()" style="font-size:1.2rem;">☰</button>
        <img src="image.png" style="height:38px;cursor:pointer;" onclick="showPage('page-home')">
    </div>
    <div class="header-right">
        <button class="btn btn-outline btn-sm" onclick="openBug()">🐛 Баг</button>
        <div id="adm-btn-wrap"></div>
        <img id="u-ava" style="width:38px;border-radius:50%;border:2px solid var(--accent);cursor:pointer;" onclick="logout()">
    </div>
</header>

<div class="container" id="main-container">
    <div id="page-home" class="page active-page">
        <h1 style="font-weight:900;font-size:2rem;margin-bottom:10px;">📋 Доступные заявки</h1>
        <p style="color:var(--text-dim);margin-bottom:30px;">Выберите форму для заполнения</p>
        <div id="grid-main" class="grid"></div>
    </div>
</div>

<script>
const API_BASE = 'https://meri-server.64.188.66.210.nip.io';
const state = { user:null, cats:[], activeCat:null, selDept:null, userLevel:0, lvlNames:[], admins:[] };

function toast(msg,type='success'){
    document.querySelectorAll('.toast').forEach(e=>e.remove());
    const t=document.createElement('div');
    t.className='toast toast-'+type;
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

async function init(){
    const hash=window.location.hash.slice(1);
    const params=new URLSearchParams(hash);
    let token=params.get('access_token')||localStorage.getItem('sd_token');
    if(token){
        window.location.hash='';
        localStorage.setItem('sd_token',token);
        try{
            const res=await fetch(API_BASE+'/api/user/me',{headers:{Authorization:'Bearer '+token}});
            if(!res.ok)throw new Error('Invalid');
            const data=await res.json();
            state.user=data;
            state.userLevel=data.level;
            state.lvlNames=data.lvlNames||[];
            await loadData();
            document.getElementById('ui-header').style.display='flex';
            document.getElementById('main-container').style.display='block';
            renderHeader();
            renderSidebar();
            document.getElementById('preloader').style.display='none';
        }catch(e){logout();}
    }else{
        document.getElementById('preloader').style.display='none';
        document.getElementById('page-login').style.display='flex';
    }
}

function login(){window.location.href=API_BASE+'/login';}
function logout(){localStorage.clear();window.location.reload();}

function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
    document.getElementById(id).classList.add('active-page');
    closeAllModals();
}

function openModal(content){
    document.getElementById('modal-box').innerHTML=content;
    document.getElementById('modal-overlay').style.display='flex';
}
function closeModal(){
    document.getElementById('modal-overlay').style.display='none';
}
function closeAllModals(){
    closeModal();
    closeSidebar();
}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

function openSidebar(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-backdrop').classList.add('show');
}
function closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('show');
}

function renderHeader(){
    if(!state.user)return;
    document.getElementById('u-ava').src='https://cdn.discordapp.com/avatars/'+state.user.id+'/'+state.user.avatar+'.png';
    document.getElementById('u-ava').title=state.user.username;
    document.getElementById('adm-btn-wrap').innerHTML='';
}

function renderSidebar(){
    const sidebarAdmin=document.getElementById('sidebar-admin-items');
    sidebarAdmin.innerHTML='';
    if(state.userLevel>0){
        sidebarAdmin.innerHTML+=`<a class="sidebar-item" onclick="openAdminPanel()">⚡ Админ-панель</a>`;
        if(state.userLevel>=4){
            sidebarAdmin.innerHTML+=`<a class="sidebar-item" onclick="openAdminsList()">👥 Администраторы</a>`;
            sidebarAdmin.innerHTML+=`<a class="sidebar-item" onclick="openLvlNames()">🏷️ Названия уровней</a>`;
            sidebarAdmin.innerHTML+=`<a class="sidebar-item" onclick="openLogs()">📋 Логи</a>`;
        }
    }
}

async function loadData(){
    const catsRes=await fetch(API_BASE+'/api/categories');
    state.cats=await catsRes.json();
    renderHome();
    try{
        const admRes=await fetch(API_BASE+'/api/admin/admins',{headers:{Authorization:'Bearer '+localStorage.getItem('sd_token')}});
        if(admRes.ok)state.admins=await admRes.json();
    }catch(e){}
}

function renderHome(){
    const grid=document.getElementById('grid-main');
    if(state.cats.length===0){
        grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-dim);"><div style="font-size:4rem;">📭</div><p>Нет доступных форм</p></div>';
        return;
    }
    grid.innerHTML='';
    state.cats.forEach(c=>{
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`<div class="card-emoji">${c.emoji||'📁'}</div><div class="card-title">${c.name}</div>`;
        card.onclick=()=>openFormModal(c.id);
        grid.appendChild(card);
    });
}

function openFormModal(id){
    state.activeCat=state.cats.find(c=>c.id==id);
    state.selDept=null;
    let html=`<h2 style="font-weight:900;margin-bottom:20px;">${state.activeCat.emoji||''} ${state.activeCat.name}</h2>`;
    
    state.activeCat.questions.forEach(q=>{
        if(q.includes('[')&&q.includes('|')){
            html+=`<label>${q.split('[')[0].trim()}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;" id="dept-btns">`;
            const match=q.match(/\[(.*?)\]/);
            if(match){
                match[1].split(',').forEach(opt=>{
                    const parts=opt.split('|').map(s=>s.trim());
                    if(parts.length>=3){
                        html+=`<div class="opt-btn" data-name="${parts[0]}" data-role="${parts[1]}" data-webhook="${parts[2]}" onclick="selectDept(this)">${parts[0]}</div>`;
                    }
                });
            }
            html+=`</div>`;
        }else{
            const isReq=q.endsWith('*');
            const clean=q.replace('*','');
            html+=`<label>${clean} ${isReq?'<span style="color:var(--error);">*</span>':''}</label>
            <textarea class="u-input app-field" data-req="${isReq}" rows="2" placeholder="Введите ${clean.toLowerCase()}"></textarea>`;
        }
    });
    
    html+=`<div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-accent btn-block" onclick="submitAppModal()">📨 Отправить</button>
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>`;
    
    openModal(html);
}

function selectDept(el){
    document.querySelectorAll('#dept-btns .opt-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    state.selDept={name:el.dataset.name,role:el.dataset.role,webhook:el.dataset.webhook};
}

async function submitAppModal(){
    const inputs=document.querySelectorAll('.app-field');
    let valid=true;
    const answers=[];
    inputs.forEach(i=>{
        const val=i.value.trim();
        answers.push(val);
        if(i.dataset.req==='true'&&!val){i.classList.add('error');valid=false;}
        else i.classList.remove('error');
    });
    if(!valid)return toast('Заполните обязательные поля!','error');
    
    try{
        const res=await fetch(API_BASE+'/api/submit',{
            method:'POST',
            headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('sd_token')},
            body:JSON.stringify({categoryId:state.activeCat.id,selectedDept:state.selDept,answers})
        });
        if(!res.ok)throw new Error(await res.text());
        closeModal();
        toast('✅ Заявка отправлена!');
    }catch(e){toast('❌ Ошибка: '+e.message,'error');}
}

// ==================== АДМИН-ПАНЕЛЬ ====================
function openAdminPanel(){
    closeAllModals();
    let html=`<h2 style="font-weight:900;margin-bottom:15px;">⚡ Админ-панель</h2><p style="color:var(--text-dim);margin-bottom:20px;">Управление формами</p>`;
    
    state.cats.forEach(c=>{
        html+=`<div style="padding:15px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="editFormModal(${c.id})">
            <span><b>${c.emoji||'📁'} ${c.name}</b></span>
            <span style="font-size:0.65rem;background:${c.color||'#d4a373'};color:#000;padding:3px 8px;border-radius:6px;">${state.lvlNames[(c.minLvl||1)-1]||'Lvl'}</span>
        </div>`;
    });
    
    html+=`<button class="btn btn-accent btn-block btn-sm" onclick="addFormModal()" style="margin-top:10px;">+ Новая форма</button>
    <button class="btn btn-outline btn-block btn-sm" onclick="closeModal()" style="margin-top:5px;">Закрыть</button>`;
    
    document.getElementById('modal-box').classList.add('modal-wide');
    openModal(html);
}

function editFormModal(id){
    const cat=state.cats.find(c=>c.id==id);
    let html=`<h2 style="font-weight:900;margin-bottom:20px;">✏️ ${cat.name}</h2>
    <label>Название</label><input id="ed-n" class="u-input" value="${cat.name}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
        <div><label>Эмодзи</label><input id="ed-e" class="u-input" value="${cat.emoji||'📁'}"></div>
        <div><label>Мин. уровень</label><select id="ed-l" class="u-input">${state.lvlNames.map((n,i)=>`<option value="${i+1}" ${(cat.minLvl||1)==i+1?'selected':''}>${i+1} — ${n}</option>`).join('')}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
        <div><label>Цвет эмбеда</label><input id="ed-c" type="color" class="u-input" value="${cat.color||'#d4a373'}"></div>
        <div><label>Пинг-роль (ID)</label><input id="ed-p" class="u-input" value="${cat.pingRole||''}" placeholder="123456789"></div>
    </div>
    <label>Webhook URL</label><input id="ed-w" class="u-input" value="${cat.webhook||''}">
    <label>Thumbnail URL</label><input id="ed-th" class="u-input" value="${cat.thumbnail||''}">
    <label>Image URL</label><input id="ed-im" class="u-input" value="${cat.image||''}">
    <label>Вопросы</label><textarea id="ed-q" class="u-input" style="height:150px;font-family:monospace;">${cat.questions.join('\n')}</textarea>
    <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-accent btn-block" onclick="saveForm(${id})">💾 Сохранить</button>
        <button class="btn btn-danger" onclick="deleteForm(${id})">🗑️</button>
    </div>
    <button class="btn btn-outline btn-block btn-sm" onclick="openAdminPanel()" style="margin-top:5px;">← Назад</button>`;
    openModal(html);
}

function addFormModal(){
    state.cats.push({id:Date.now(),name:'Новая форма',emoji:'📋',questions:['Ваше имя*'],minLvl:1,color:'#d4a373',pingRole:'',thumbnail:'',image:''});
    editFormModal(state.cats[state.cats.length-1].id);
}

async function saveForm(id){
    const idx=state.cats.findIndex(c=>c.id==id);
    state.cats[idx]={
        ...state.cats[idx],
        name:document.getElementById('ed-n').value,
        emoji:document.getElementById('ed-e').value,
        minLvl:parseInt(document.getElementById('ed-l').value),
        webhook:document.getElementById('ed-w').value,
        questions:document.getElementById('ed-q').value.split('\n').filter(q=>q.trim()),
        color:document.getElementById('ed-c').value,
        pingRole:document.getElementById('ed-p').value,
        thumbnail:document.getElementById('ed-th').value,
        image:document.getElementById('ed-im').value
    };
    await updateCategories();
    toast('✅ Сохранено');
    openAdminPanel();
}

async function deleteForm(id){
    if(!confirm('Удалить?'))return;
    state.cats=state.cats.filter(c=>c.id!=id);
    await updateCategories();
    toast('🗑️ Удалено');
    openAdminPanel();
}

async function updateCategories(){
    await fetch(API_BASE+'/api/admin/categories',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('sd_token')},
        body:JSON.stringify({categories:state.cats})
    });
    renderHome();
}

// ==================== АДМИНЫ ====================
async function openAdminsList(){
    closeAllModals();
    const res=await fetch(API_BASE+'/api/admin/admins',{headers:{Authorization:'Bearer '+localStorage.getItem('sd_token')}});
    state.admins=await res.json();
    let html=`<h2 style="font-weight:900;margin-bottom:15px;">👥 Администраторы</h2>`;
    if(state.admins.length===0){
        html+=`<p style="color:var(--text-dim);">Нет администраторов</p>`;
    }else{
        state.admins.forEach(a=>{
            html+=`<div style="padding:12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
                <span>ID: ${a.userId}</span>
                <span style="background:var(--accent);color:#000;padding:3px 10px;border-radius:6px;font-weight:700;">${state.lvlNames[a.level-1]||'Lvl '+a.level}</span>
            </div>`;
        });
    }
    html+=`<label>Добавить/Изменить</label>
    <input id="mid" class="u-input" placeholder="Discord ID">
    <input id="mlvl" type="number" class="u-input" placeholder="Уровень (0=удалить)" min="0" max="5">
    <button class="btn btn-accent btn-block" onclick="saveAdmin()">💾 Сохранить</button>
    <button class="btn btn-outline btn-block btn-sm" onclick="closeModal()" style="margin-top:5px;">Закрыть</button>`;
    openModal(html);
}

async function saveAdmin(){
    const uid=document.getElementById('mid').value.trim();
    const lvl=parseInt(document.getElementById('mlvl').value);
    if(!uid||isNaN(lvl))return;
    await fetch(API_BASE+'/api/admin/admins',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('sd_token')},
        body:JSON.stringify({userId:uid,level:lvl})
    });
    toast('✅ Сохранено');
    openAdminsList();
}

// ==================== УРОВНИ ====================
function openLvlNames(){
    closeAllModals();
    let html=`<h2 style="font-weight:900;margin-bottom:15px;">🏷️ Названия уровней</h2>`;
    state.lvlNames.forEach((n,i)=>html+=`<input class="u-input l-edit" value="${n}" placeholder="Уровень ${i+1}">`);
    html+=`<button class="btn btn-accent btn-block" onclick="saveLvls()" style="margin-top:15px;">💾 Сохранить</button>
    <button class="btn btn-outline btn-block btn-sm" onclick="closeModal()" style="margin-top:5px;">Закрыть</button>`;
    openModal(html);
}

async function saveLvls(){
    const names=Array.from(document.querySelectorAll('.l-edit')).map(i=>i.value.trim());
    await fetch(API_BASE+'/api/admin/lvlnames',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('sd_token')},
        body:JSON.stringify({names})
    });
    state.lvlNames=names;
    toast('✅ Сохранено');
    closeModal();
}

// ==================== ЛОГИ ====================
async function openLogs(){
    closeAllModals();
    const res=await fetch(API_BASE+'/api/admin/logs',{headers:{Authorization:'Bearer '+localStorage.getItem('sd_token')}});
    const logs=await res.json();
    let html=`<h2 style="font-weight:900;margin-bottom:15px;">📋 Логи</h2><div style="max-height:400px;overflow-y:auto;">`;
    logs.forEach(l=>{
        html+=`<div style="padding:10px;border-bottom:1px solid var(--border);font-size:0.8rem;">
            <span style="color:var(--accent);">[${l.timestamp}]</span> <b>${l.user}</b>: ${l.action}
        </div>`;
    });
    html+=`</div><button class="btn btn-outline btn-block btn-sm" onclick="closeModal()" style="margin-top:10px;">Закрыть</button>`;
    document.getElementById('modal-box').classList.add('modal-wide');
    openModal(html);
}

// ==================== БАГ-РЕПОРТ ====================
function openBug(){
    const html=`<h2 style="font-weight:900;margin-bottom:15px;">🐛 Баг-репорт</h2>
    <p style="color:var(--text-dim);margin-bottom:15px;">Опишите проблему</p>
    <textarea id="bug-text" class="u-input" style="height:120px;"></textarea>
    <div style="display:flex;gap:10px;margin-top:15px;">
        <button class="btn btn-accent btn-block" onclick="sendBug()">📨 Отправить</button>
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>`;
    openModal(html);
}

async function sendBug(){
    const desc=document.getElementById('bug-text').value;
    if(!desc.trim())return toast('Введите описание!','error');
    await fetch(API_BASE+'/api/bug',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('sd_token')},
        body:JSON.stringify({description:desc})
    });
    closeModal();
    toast('✅ Отправлено');
}

window.onload=init;
</script>
</body>
</html>
