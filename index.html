<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LSCSD Portal</title>
    <link rel="icon" type="image/png" href="image.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        :root {
            --bg: #030508;
            --card: #0a0d12;
            --accent: #d4a373;
            --border: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --error: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        #preloader { position: fixed; inset: 0; background: var(--bg); z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .loader-logo { width: 100px; filter: drop-shadow(0 0 15px var(--accent)); margin-bottom: 20px; }
        .loader-bar { width: 150px; height: 2px; background: var(--border); position: relative; overflow: hidden; }
        .loader-progress { position: absolute; width: 40%; height: 100%; background: var(--accent); animation: move 1.5s infinite linear; }
        @keyframes move { from { left: -50%; } to { left: 110%; } }

        header { display: none; justify-content: space-between; align-items: center; padding: 0 5%; height: 90px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 1000; }
        
        .container { display: none; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page { display: none; animation: fadeIn 0.4s ease forwards; }
        .page.active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card); padding: 40px 20px; border-radius: 24px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .u-input { width: 100%; padding: 20px; background: #010204; border: 1px solid var(--border); border-radius: 16px; color: #fff; outline: none; margin-bottom: 5px; font-size: 1rem; }
        .u-input:focus { border-color: var(--accent); }
        .u-input.error { border-color: var(--error); }

        .btn-main { background: var(--accent); color: #000; width: 100%; padding: 20px; border-radius: 16px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-main:hover { opacity: 0.8; }
        
        .opt-btn { padding: 20px; background: #010204; border: 1px solid var(--border); border-radius: 14px; color: #fff; cursor: pointer; text-align: center; font-weight: 800; transition: 0.3s; }
        .opt-btn.active { background: var(--accent); color: #000; }
        .opt-btn.error { border-color: var(--error); }

        .admin-layout { display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .cat-item { padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        
        label { display: block; font-size: 0.7rem; color: var(--accent); font-weight: 900; text-transform: uppercase; margin: 25px 0 8px; letter-spacing: 1px; }

        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-box { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 24px; width: 400px; border-top: 4px solid var(--accent); }
    </style>
</head>
<body>

    <div id="preloader">
        <img src="image.png" class="loader-logo">
        <div class="loader-bar"><div class="loader-progress"></div></div>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title" style="margin-bottom: 10px; font-weight: 900;"></h2>
            <p id="modal-text" style="color: var(--text-dim); margin-bottom: 25px; font-size: 0.9rem;"></p>
            <div id="modal-extra"></div>
            <div id="modal-actions" style="display:flex; gap:10px;"></div>
        </div>
    </div>

    <div id="page-login" style="display:none; height:100vh; flex-direction:column; justify-content:center; align-items:center;">
        <div style="background:var(--card); padding:50px; border-radius:30px; border:1px solid var(--border); text-align:center; width:380px;">
            <img src="image.png" style="width:80px; margin-bottom:20px;">
            <h2 style="margin-bottom:30px; font-weight:900;">LSCSD PORTAL</h2>
            <button class="btn-main" style="background:#5865F2; color:#fff;" onclick="login()">Войти через Discord</button>
        </div>
    </div>

    <header id="ui-header">
        <img src="image.png" style="height:50px; cursor:pointer;" onclick="showPage('page-home')">
        <div style="display:flex; align-items:center; gap:15px;">
            <button style="background:var(--error); border:none; color:#fff; padding:10px 15px; border-radius:10px; font-weight:800; cursor:pointer;" onclick="openBug()">СООБЩИТЬ ОБ ОШИБКЕ</button>
            <div id="adm-btn-wrap"></div>
            <img id="u-ava" style="width:40px; border-radius:50%; border:2px solid var(--accent); cursor:pointer;" onclick="logout()">
        </div>
    </header>

    <div class="container" id="main-container">
        <div id="page-home" class="page active-page">
            <h1 style="margin-bottom:35px; font-weight:900; font-size:2.2rem;">Доступные заявки</h1>
            <div id="grid-main" class="grid"></div>
        </div>

        <div id="page-apply" class="page">
            <div style="background:var(--card); padding:40px; border-radius:24px; border:1px solid var(--border);">
                <p onclick="showPage('page-home')" style="color:var(--accent); cursor:pointer; font-weight:900; margin-bottom:25px; font-size:0.75rem;">← НАЗАД</p>
                <h2 id="apply-title" style="font-weight:900; font-size:2rem; margin-bottom:30px;"></h2>
                <div id="dept-selector" style="display:none; margin-bottom:30px;">
                    <label id="dept-label"></label>
                    <div id="dept-btns" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;"></div>
                </div>
                <div id="apply-fields"></div>
                <button id="submit-btn" class="btn-main" style="margin-top:20px;" onclick="submitApp()">ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>

        <div id="page-admin" class="page">
            <div class="admin-layout">
                <aside>
                    <div style="background:var(--card); padding:20px; border-radius:20px; border:1px solid var(--border); margin-bottom:20px;">
                        <label style="margin-top:0">СПИСОК ФОРМ</label>
                        <div id="admin-cat-list"></div>
                        <button class="btn-main" style="padding:12px; font-size:0.7rem;" onclick="addForm()">+ ДОБАВИТЬ</button>
                    </div>
                    <div id="owner-tools" style="display:none; background:var(--card); padding:20px; border-radius:20px; border:1px solid var(--border);">
                        <label style="margin-top:0">УПРАВЛЕНИЕ</label>
                        <button class="btn-main" style="background:#111; color:#fff; margin-bottom:10px;" onclick="manageAdmins()">АДМИНЫ</button>
                        <button class="btn-main" style="background:#111; color:#fff;" onclick="manageLvls()">LVL NAMES</button>
                    </div>
                </aside>
                <main id="admin-editor" style="background:var(--card); padding:30px; border-radius:20px; border:1px solid var(--border);">
                    <p style="text-align:center; color:var(--text-dim); margin-top:50px;">Выберите форму для редактирования</p>
                </main>
            </div>
        </div>
    </div>

<script>
    // Конфигурация
    const API_BASE = 'https://meri-server.64.188.66.210.nip.io';

    // Состояние
    const state = {
        user: null,
        cats: [],
        activeCat: null,
        selDept: null,
        userLevel: 0,
        lvlNames: []
    };

    // ------------------ Авторизация ------------------
    async function init() {
        const hash = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);
        let token = params.get('access_token') || localStorage.getItem('sd_token');

        if (token) {
            // Очищаем URL от токена
            window.location.hash = '';
            localStorage.setItem('sd_token', token);

            try {
                const res = await fetch(`${API_BASE}/api/user/me`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Invalid token');
                const data = await res.json();
                state.user = data;
                state.userLevel = data.level;
                state.lvlNames = data.lvlNames || [];

                // Загружаем категории и показываем UI
                await loadCategories();
                document.getElementById('ui-header').style.display = 'flex';
                document.getElementById('main-container').style.display = 'block';
                renderHeader();
                document.getElementById('preloader').style.opacity = '0';
                setTimeout(() => document.getElementById('preloader').style.display = 'none', 500);
            } catch (e) {
                logout();
            }
        } else {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('page-login').style.display = 'flex';
        }
    }

    function login() {
        window.location.href = `${API_BASE}/login`;
    }

    function logout() {
        localStorage.removeItem('sd_token');
        window.location.hash = '';
        window.location.reload();
    }

    // ------------------ UI ------------------
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
        window.scrollTo(0,0);
    }

    function renderHeader() {
        if (state.user) {
            document.getElementById('u-ava').src = `https://cdn.discordapp.com/avatars/${state.user.id}/${state.user.avatar}.png`;
            const admWrap = document.getElementById('adm-btn-wrap');
            if (state.userLevel > 0) {
                admWrap.innerHTML = `<button onclick="showPage('page-admin')" style="background:var(--accent); border:none; padding:10px 15px; border-radius:10px; font-weight:800; cursor:pointer; color:#000;">АДМИН-ПАНЕЛЬ</button>`;
            } else {
                admWrap.innerHTML = '';
            }
        }
    }

    // ------------------ Категории и формы ------------------
    async function loadCategories() {
        const res = await fetch(`${API_BASE}/api/categories`);
        state.cats = await res.json();
        renderHome();
        if (document.getElementById('admin-cat-list')) renderAdminList();
    }

    function renderHome() {
        const grid = document.getElementById('grid-main');
        if (!grid) return;
        grid.innerHTML = '';
        state.cats.forEach(c => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div style="font-size:3rem; margin-bottom:15px;">${c.emoji}</div><h3 style="text-transform:uppercase; font-weight:900;">${c.name}</h3>`;
            card.onclick = () => openForm(c.id);
            grid.appendChild(card);
        });
    }

    function openForm(id) {
        state.activeCat = state.cats.find(c => c.id == id);
        state.selDept = null;
        document.getElementById('apply-title').innerText = state.activeCat.name;
        const fields = document.getElementById('apply-fields');
        fields.innerHTML = '';
        const deptSelector = document.getElementById('dept-selector');
        deptSelector.style.display = 'none';

        state.activeCat.questions.forEach(q => {
            if (q.includes('[') && q.includes('|')) {
                deptSelector.style.display = 'block';
                document.getElementById('dept-label').innerText = q.split('[')[0].trim();
                const bBox = document.getElementById('dept-btns');
                bBox.innerHTML = '';
                const match = q.match(/\[(.*?)\]/)[1].split(',');
                match.forEach(p => {
                    const parts = p.split('|').map(s => s.trim());
                    const btn = document.createElement('div');
                    btn.className = 'opt-btn';
                    btn.innerText = parts[0];
                    btn.onclick = () => {
                        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        state.selDept = { name: parts[0], role: parts[1], webhook: parts[2] || state.activeCat.webhook };
                    };
                    bBox.appendChild(btn);
                });
            } else {
                const isRequired = q.endsWith('*');
                const cleanName = q.replace('*', '');
                fields.innerHTML += `<label>${cleanName} ${isRequired ? '<span style="color:red">•</span>':''}</label>
                  <textarea class="u-input" data-req="${isRequired}" rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>`;
            }
        });
        showPage('page-apply');
    }

    async function submitApp() {
        const inputs = Array.from(document.querySelectorAll('#apply-fields textarea'));
        let valid = true;
        const answers = [];
        inputs.forEach(i => {
            const val = i.value.trim();
            answers.push(val);
            if (i.dataset.req === 'true' && !val) {
                i.classList.add('error');
                valid = false;
            } else {
                i.classList.remove('error');
            }
        });
        if (!valid) return alert('Заполните обязательные поля!');

        const payload = {
            categoryId: state.activeCat.id,
            selectedDept: state.selDept,
            answers
        };

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = 'ОТПРАВКА...';
        try {
            const res = await fetch(`${API_BASE}/api/submit`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('sd_token')}`
                },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(await res.text());
            alert('Заявка отправлена!');
            showPage('page-home');
        } catch (e) {
            alert('Ошибка: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'ОТПРАВИТЬ ЗАЯВКУ';
        }
    }

    // ------------------ Баг-репорт ------------------
    function openBug() {
        document.getElementById('modal-title').innerText = 'ОТЧЕТ ОБ ОШИБКЕ';
        document.getElementById('modal-text').innerText = 'Опишите проблему, которую вы обнаружили.';
        document.getElementById('modal-extra').innerHTML = `<textarea id="bug-text" class="u-input" style="height:120px; margin-top:10px;" placeholder="Что пошло не так?"></textarea>`;
        document.getElementById('modal-actions').innerHTML = `
            <button class="btn-main" onclick="sendBug()">ОТПРАВИТЬ</button>
            <button class="btn-main" style="background:#333; color:#fff;" onclick="closeModal()">ОТМЕНА</button>
        `;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    async function sendBug() {
        const desc = document.getElementById('bug-text').value;
        if (!desc.trim()) return alert('Введите текст ошибки!');
        const btn = document.querySelector('#modal-actions button');
        btn.disabled = true;
        btn.innerText = 'ОТПРАВКА...';
        try {
            await fetch(`${API_BASE}/api/bug`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('sd_token')}`
                },
                body: JSON.stringify({ description: desc })
            });
            closeModal();
            alert('Отчет отправлен!');
        } catch (e) {
            alert('Ошибка отправки');
        } finally {
            btn.disabled = false;
            btn.innerText = 'ОТПРАВИТЬ';
        }
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    // ------------------ Админ-панель ------------------
    function renderAdminList() {
        const list = document.getElementById('admin-cat-list');
        if (!list) return;
        list.innerHTML = '';
        state.cats.forEach(c => {
            const minLvl = c.minLvl || 1;
            const acc = state.userLevel >= minLvl;
            const item = document.createElement('div');
            item.className = 'cat-item';
            item.style.opacity = acc ? '1' : '0.3';
            item.style.pointerEvents = acc ? 'auto' : 'none';
            item.innerHTML = `<span style="font-weight:700;">${c.emoji} ${c.name}</span>
                <span style="font-size:0.6rem; background:var(--accent); color:#000; padding:2px 6px; border-radius:4px;">${state.lvlNames[minLvl-1] || 'Lvl '+minLvl}</span>`;
            item.onclick = () => editForm(c.id);
            list.appendChild(item);
        });

        // owner tools
        const ownerTools = document.getElementById('owner-tools');
        ownerTools.style.display = state.userLevel >= 4 ? 'block' : 'none'; // условно
    }

    function editForm(id) {
        const cat = state.cats.find(c => c.id == id);
        const editor = document.getElementById('admin-editor');
        editor.innerHTML = `
            <h2 style="margin-bottom:20px;">${cat.name}</h2>
            <label>Название</label><input id="ed-n" class="u-input" value="${cat.name}">
            <label>Эмодзи</label><input id="ed-e" class="u-input" value="${cat.emoji || '📁'}">
            <label>Миним. уровень доступа</label>
            <select id="ed-l" class="u-input">
                ${state.lvlNames.map((n,i) => `<option value="${i+1}" ${cat.minLvl == i+1 ? 'selected':''}>${i+1} - ${n}</option>`).join('')}
            </select>
            <label>Общий Webhook</label><input id="ed-w" class="u-input" value="${cat.webhook || ''}">
            <label>Вопросы (по одному на строку, * для обязательных)</label>
            <textarea id="ed-q" class="u-input" style="height:150px;">${cat.questions.join('\n')}</textarea>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-main" onclick="saveForm(${id})">СОХРАНИТЬ</button>
                <button class="btn-main" style="background:#ff4d4d; color:#fff;" onclick="deleteForm(${id})">УДАЛИТЬ</button>
            </div>
        `;
    }

    async function saveForm(id) {
        const idx = state.cats.findIndex(c => c.id == id);
        state.cats[idx] = {
            ...state.cats[idx],
            name: document.getElementById('ed-n').value,
            emoji: document.getElementById('ed-e').value,
            minLvl: parseInt(document.getElementById('ed-l').value),
            webhook: document.getElementById('ed-w').value,
            questions: document.getElementById('ed-q').value.split('\n').filter(q => q.trim())
        };
        await updateCategoriesOnServer();
        alert('Сохранено');
    }

    async function deleteForm(id) {
        if (!confirm('Удалить форму?')) return;
        state.cats = state.cats.filter(c => c.id != id);
        await updateCategoriesOnServer();
        document.getElementById('admin-editor').innerHTML = '<p style="text-align:center;color:var(--text-dim);margin-top:50px;">Выберите форму для редактирования</p>';
    }

    function addForm() {
        state.cats.push({
            id: Date.now(),
            name: 'Новая форма',
            emoji: '📋',
            questions: ['Nickname*'],
            minLvl: 1
        });
        updateCategoriesOnServer();
    }

    async function updateCategoriesOnServer() {
        try {
            await fetch(`${API_BASE}/api/admin/categories`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('sd_token')}`
                },
                body: JSON.stringify({ categories: state.cats })
            });
            renderHome();
            renderAdminList();
        } catch (e) {
            alert('Ошибка сохранения на сервере');
        }
    }

    function manageAdmins() {
        document.getElementById('modal-title').innerText = 'Управление админами';
        document.getElementById('modal-text').innerText = 'Введите ID пользователя и уровень (0 - снять)';
        document.getElementById('modal-extra').innerHTML = `
            <input id="mid" class="u-input" placeholder="ID Discord">
            <input id="mlvl" type="number" class="u-input" placeholder="Уровень (0-5)">
        `;
        document.getElementById('modal-actions').innerHTML = `
            <button class="btn-main" onclick="setAdmin()">ОК</button>
            <button class="btn-main" style="background:#333;color:#fff;" onclick="closeModal()">ОТМЕНА</button>
        `;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    async function setAdmin() {
        const userId = document.getElementById('mid').value.trim();
        const level = parseInt(document.getElementById('mlvl').value);
        if (!userId || isNaN(level)) return;
        try {
            await fetch(`${API_BASE}/api/admin/admins`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('sd_token')}`
                },
                body: JSON.stringify({ userId, level })
            });
            closeModal();
            // обновим уровень текущего пользователя (простой рефетч)
            const res = await fetch(`${API_BASE}/api/user/me`, {
                headers: { Authorization: `Bearer ${localStorage.getItem('sd_token')}` }
            });
            const data = await res.json();
            state.userLevel = data.level;
            state.lvlNames = data.lvlNames || [];
            renderHeader();
            alert('Обновлено');
        } catch (e) {
            alert('Ошибка');
        }
    }

    function manageLvls() {
        document.getElementById('modal-title').innerText = 'Названия уровней';
        document.getElementById('modal-text').innerText = 'Измените названия уровней (по порядку с 1)';
        document.getElementById('modal-extra').innerHTML = state.lvlNames.map((n, i) => `<input class="u-input l-edit" value="${n}" placeholder="Lvl ${i+1}">`).join('');
        document.getElementById('modal-actions').innerHTML = `
            <button class="btn-main" onclick="saveLvlNames()">СОХРАНИТЬ</button>
            <button class="btn-main" style="background:#333;color:#fff;" onclick="closeModal()">ОТМЕНА</button>
        `;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    async function saveLvlNames() {
        const names = Array.from(document.querySelectorAll('.l-edit')).map(i => i.value.trim());
        if (names.length !== 5) return alert('Должно быть ровно 5 уровней');
        try {
            await fetch(`${API_BASE}/api/admin/lvlnames`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('sd_token')}`
                },
                body: JSON.stringify({ names })
            });
            closeModal();
            state.lvlNames = names;
            // Обновим отображение в UI
            if (document.getElementById('admin-cat-list')) renderAdminList();
            alert('Сохранено');
        } catch (e) {
            alert('Ошибка');
        }
    }

    // Запуск
    window.onload = init;
</script>
</body>
</html>
