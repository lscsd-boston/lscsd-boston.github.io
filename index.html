<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LSCSD | Portal Elite</title>
    <link rel="icon" type="image/png" href="image.png">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bg: #05070a; --card: #0d1117; --accent: #d4a373; --border: rgba(255, 255, 255, 0.08); --text: #f1f3f5; --text-dim: #8b949e; --input-bg: #010409; --error: #e63946; --success: #2a9d8f; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; opacity: 0; animation: pageIn 0.8s ease forwards; }
        
        @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardFade { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 20000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-box { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 95%; max-width: 450px; text-align: center; animation: cardFade 0.3s ease; }
        
        #preloader { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: flex; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        header { display: none; justify-content: space-between; align-items: center; padding: 0 5%; height: 80px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .container { display: none; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .opt-btn { padding: 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); cursor: pointer; font-weight: 700; text-align: center; transition: 0.2s; font-size: 0.85rem; }
        .opt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 5px 15px rgba(212, 163, 115, 0.3); }

        .form-box { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); animation: cardFade 0.5s ease; }
        label { display: block; font-size: 0.7rem; color: var(--accent); font-weight: 900; text-transform: uppercase; margin: 20px 0 8px; letter-spacing: 1.5px; }
        .u-input { width: 100%; padding: 18px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); outline: none; font-size: 0.95rem; transition: 0.3s; margin-bottom: 10px; }
        
        .btn-main { background: var(--accent); color: #fff; width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { opacity: 0.85; transform: translateY(-2px); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 40px 20px; border-radius: 18px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .admin-layout { display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .cat-item { padding: 15px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; margin-bottom: 10px; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .lvl-badge { background: var(--accent); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 900; font-size: 0.6rem; }
        
        .page { display: none; }
        .active-page { display: block; }
        .bug-btn { background: #e63946; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 800; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="preloader"><div class="spinner"></div></div>

    <div id="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title" style="margin-bottom: 10px;">Система</h3>
            <p id="modal-text" style="color: var(--text-dim);"></p>
            <div id="modal-extra-content"></div>
            <div class="modal-btns" id="modal-actions" style="display:flex; gap:10px; margin-top:20px;"></div>
        </div>
    </div>

    <div id="page-login" style="display:none; height:100vh; flex-direction:column; justify-content:center; align-items:center;">
        <img src="image.png" style="width:110px; margin-bottom:25px;">
        <button class="btn-main" style="width:260px; background:#5865F2;" onclick="login()">ВОЙТИ ЧЕРЕЗ DISCORD</button>
    </div>

    <header id="ui-header">
        <div onclick="showPage('page-home')"><img src="image.png" style="height:45px; cursor:pointer;"></div>
        <div style="display:flex; align-items:center;">
            <button class="bug-btn" onclick="openBugReport()">БАГ ⚠️</button>
            <div id="adm-btn-wrap"></div>
            <img id="u-ava" style="width:40px; height:40px; border-radius:50%; border:2px solid var(--accent); margin-left: 15px;">
            <button onclick="logout()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; margin-left: 10px;">✕</button>
        </div>
    </header>

    <div class="container" id="main-container">
        <div id="page-home" class="page active-page">
            <h2 style="margin-bottom:30px; font-weight:900;">Направления</h2>
            <div id="grid-main" class="grid"></div>
        </div>

        <div id="page-apply" class="page">
            <div class="form-box">
                <p onclick="showPage('page-home')" style="color:var(--accent); cursor:pointer; font-weight:900; margin-bottom:20px; font-size:0.75rem;">← ВЕРНУТЬСЯ</p>
                <h2 id="apply-title" style="font-weight:900; margin-bottom:10px;"></h2>
                <div id="dept-selector" style="display:none; margin-bottom: 25px;">
                    <label id="dept-label">Выберите отдел</label>
                    <div id="dept-btns" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px;"></div>
                </div>
                <div id="apply-fields"></div>
                <button id="submit-btn" class="btn-main" onclick="submitApplication()">ОТПРАВИТЬ</button>
            </div>
        </div>

        <div id="page-admin" class="page">
            <div class="admin-layout">
                <div>
                    <div style="background:var(--card); padding:20px; border-radius:15px; border:1px solid var(--border); margin-bottom:20px;">
                        <h4 style="font-size:0.7rem; color:var(--accent); margin-bottom:15px; text-transform:uppercase;">Категории</h4>
                        <div id="admin-cat-list"></div>
                        <button class="btn-main" style="padding:12px; font-size:0.7rem;" onclick="createNewForm()">+ НОВАЯ ФОРМА</button>
                    </div>
                    <div id="owner-tools" style="background:var(--card); padding:20px; border-radius:15px; border:1px solid var(--border); display:none;">
                        <h4 style="font-size:0.7rem; color:var(--accent); margin-bottom:15px; text-transform:uppercase;">Управление админкой</h4>
                        <button class="btn-main" style="padding:12px; font-size:0.7rem; background:#222;" onclick="openAdminManager()">ВЫДАТЬ ДОСТУП</button>
                    </div>
                </div>
                <div id="admin-editor" class="form-box">
                    <p style="color:var(--text-dim); text-align:center;">Выберите форму для редактирования</p>
                </div>
            </div>
        </div>
    </div>

<script>
    const CONFIG = {
        firebase: { databaseURL: atob("aHR0cHM6Ly9sc2NzZC1wb3J0YWwxMy1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20v") },
        discord: { 
            ownerId: '1097047579876929616', 
            clientId: '1496624504548364448', 
            redirectUri: window.location.origin + '/',
            logWebhook: 'https://discord.com/api/webhooks/1497496288416108565/eshuRyqkErg2HOrUVqLFXaFEWjw6Ql1PSz8EQGjHtDyYkY62weFhHZLe8sC1rb8Owaxn'
        }
    };

    firebase.initializeApp(CONFIG.firebase);
    const db = firebase.database();
    let state = { user: null, cats: [], admins: {}, userLvl: 0 };

    async function sendDiscordMsg(title, desc, ping = false) {
        const payload = { content: ping ? `<@${CONFIG.discord.ownerId}>` : '', embeds: [{ title: title, description: desc, color: 13935475, timestamp: new Date() }] };
        return fetch(CONFIG.discord.logWebhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    }

    function showAlert(t, msg) {
        document.getElementById('modal-title').innerText = t;
        document.getElementById('modal-text').innerText = msg;
        document.getElementById('modal-extra-content').innerHTML = '';
        document.getElementById('modal-actions').innerHTML = `<button class="btn-main" style="margin:0" onclick="closeModal()">ОК</button>`;
        document.getElementById('modal-overlay').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    async function init() {
        let token = new URLSearchParams(window.location.hash.slice(1)).get('access_token') || localStorage.getItem('sd_token');
        if (token) {
            localStorage.setItem('sd_token', token);
            try {
                const res = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                state.user = await res.json();
                document.getElementById('preloader').style.display = 'none';
                document.getElementById('ui-header').style.display = 'flex';
                document.getElementById('main-container').style.display = 'block';
                sync();
            } catch(e) { logout(); }
        } else {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('page-login').style.display = 'flex';
        }
    }

    function sync() {
        // Синхронизация админов
        db.ref('portal_db/admins').on('value', snap => {
            state.admins = snap.val() || {};
            if (state.user.id === CONFIG.discord.ownerId) {
                state.userLvl = 5;
                document.getElementById('owner-tools').style.display = 'block';
            } else {
                state.userLvl = state.admins[state.user.id] || 0;
            }
            renderHeader();
        });

        // Синхронизация категорий
        db.ref('portal_db/categories').on('value', snap => {
            state.cats = snap.val() || [];
            renderHome();
            renderAdminList();
        });
    }

    function renderHome() {
        const grid = document.getElementById('grid-main');
        grid.innerHTML = '';
        state.cats.forEach(c => {
            grid.innerHTML += `<div class="card" onclick="openForm(${c.id})"><div style="font-size:2.5rem; margin-bottom:15px;">${c.emoji}</div><h3 style="font-weight:800;">${c.name}</h3></div>`;
        });
    }

    function openForm(id) {
        state.activeCat = state.cats.find(x => x.id === id);
        state.selectedDept = null;
        document.getElementById('apply-title').innerText = state.activeCat.name;
        
        const fields = document.getElementById('apply-fields');
        const deptBox = document.getElementById('dept-selector');
        const deptBtns = document.getElementById('dept-btns');
        fields.innerHTML = '';
        deptBox.style.display = 'none';

        state.activeCat.questions.forEach(q => {
            if (q.includes('[') && q.includes('|')) {
                const raw = q.match(/\[(.*?)\]/)[1];
                deptBox.style.display = 'block';
                document.getElementById('dept-label').innerText = q.split('[')[0].trim() || "Выберите отдел";
                deptBtns.innerHTML = '';
                raw.split(',').forEach(p => {
                    const info = p.split('|').map(s => s.trim());
                    const b = document.createElement('div');
                    b.className = 'opt-btn'; b.innerText = info[0];
                    b.onclick = () => {
                        document.querySelectorAll('.opt-btn').forEach(x => x.classList.remove('active'));
                        b.classList.add('active');
                        state.selectedDept = { name: info[0], role: info[1], hook: info[2] || state.activeCat.webhook };
                    };
                    deptBtns.appendChild(b);
                });
            } else {
                const isReq = q.endsWith('*');
                fields.innerHTML += `<label>${q.replace('*','')} ${isReq ? '<span style="color:red">•</span>' : ''}</label>
                <textarea class="u-input" data-req="${isReq}" style="height:100px;"></textarea>`;
            }
        });
        showPage('page-apply');
    }

    async function submitApplication() {
        const inputs = Array.from(document.querySelectorAll('#apply-fields textarea'));
        let valid = true;
        inputs.forEach(i => {
            if(i.dataset.req === "true" && !i.value.trim()) { i.style.borderColor = 'red'; valid = false; }
            else { i.style.borderColor = 'var(--border)'; }
        });
        if(!valid) return showAlert("Ошибка", "Заполните обязательные поля!");

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        const answers = inputs.map((t, idx) => ({ name: `Вопрос ${idx+1}`, value: t.value || "—" }));
        const hook = state.selectedDept ? state.selectedDept.hook : state.activeCat.webhook;
        
        await fetch(hook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
            content: (state.selectedDept && state.selectedDept.role !== '123') ? `<@&${state.selectedDept.role}>` : '',
            embeds: [{ title: `ЗАЯВКА: ${state.activeCat.name}`, fields: answers, footer: { text: `От: ${state.user.username}` }, timestamp: new Date() }]
        })});
        
        showAlert("Успех", "Заявка отправлена!");
        showPage('page-home');
        btn.disabled = false;
    }

    function renderAdminList() {
        const list = document.getElementById('admin-cat-list');
        list.innerHTML = '';
        state.cats.forEach(c => {
            const canEdit = state.userLvl >= (c.minLvl || 1);
            list.innerHTML += `
                <div class="cat-item" style="${!canEdit ? 'opacity:0.5; cursor:not-allowed;' : ''}" onclick="${canEdit ? `editForm(${c.id})` : ''}">
                    <span>${c.emoji} ${c.name}</span>
                    <span class="lvl-badge">LVL ${c.minLvl || 1}</span>
                </div>`;
        });
    }

    function editForm(id) {
        const c = state.cats.find(x => x.id === id);
        document.getElementById('admin-editor').innerHTML = `
            <label>Название</label><input type="text" id="ed-name" class="u-input" value="${c.name}">
            <label>Нужный уровень админки (1-5)</label>
            <input type="number" id="ed-lvl" class="u-input" min="1" max="5" value="${c.minLvl || 1}">
            <label>Webhook</label><input type="text" id="ed-webhook" class="u-input" value="${c.webhook || ''}">
            <label>Вопросы</label>
            <textarea id="ed-qs" class="u-input" style="height:150px;">${c.questions.join('\n')}</textarea>
            <button class="btn-main" onclick="saveForm(${id})">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        `;
    }

    function saveForm(id) {
        const idx = state.cats.findIndex(x => x.id === id);
        state.cats[idx] = {
            ...state.cats[idx],
            name: document.getElementById('ed-name').value,
            minLvl: parseInt(document.getElementById('ed-lvl').value) || 1,
            webhook: document.getElementById('ed-webhook').value,
            questions: document.getElementById('ed-qs').value.split('\n').filter(x => x.trim())
        };
        db.ref('portal_db/categories').set(state.cats).then(() => showAlert("Готово", "Форма обновлена!"));
    }

    // --- Управление Админами ---
    function openAdminManager() {
        document.getElementById('modal-title').innerText = "ВЫДАЧА АДМИН-ПРАВ";
        document.getElementById('modal-text').innerText = "Введите Discord ID и выберите уровень (0 - снять)";
        document.getElementById('modal-extra-content').innerHTML = `
            <input type="text" id="adm-id" class="u-input" placeholder="User ID (например 1097...)">
            <select id="adm-lvl" class="u-input">
                <option value="0">0 - Снять права</option>
                <option value="1">1 - Мл. Администратор</option>
                <option value="2">2 - Администратор</option>
                <option value="3">3 - Ст. Администратор</option>
                <option value="4">4 - Зам. Куратора</option>
                <option value="5">5 - Куратор / Разработчик</option>
            </select>
        `;
        document.getElementById('modal-actions').innerHTML = `
            <button class="btn-main" style="background:#333; margin:0" onclick="closeModal()">ОТМЕНА</button>
            <button class="btn-main" style="margin:0" onclick="setAdminLevel()">СОХРАНИТЬ</button>
        `;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function setAdminLevel() {
        const id = document.getElementById('adm-id').value.trim();
        const lvl = parseInt(document.getElementById('adm-lvl').value);
        if(!id) return;
        
        db.ref('portal_db/admins/' + id).set(lvl === 0 ? null : lvl).then(() => {
            closeModal();
            showAlert("Успех", "Права доступа обновлены!");
            sendDiscordMsg("ADMIN SYSTEM", `Владелец изменил уровень доступа для <@${id}> на **${lvl}**`);
        });
    }

    function createNewForm() {
        if(state.userLvl < 4) return showAlert("Ошибка", "Недостаточно прав!");
        state.cats.push({ id: Date.now(), name: "Новая форма", emoji: "📝", questions: ["Вопрос*"], minLvl: 1, webhook: "" });
        db.ref('portal_db/categories').set(state.cats);
    }

    function renderHeader() {
        if(!state.user) return;
        document.getElementById('u-ava').src = `https://cdn.discordapp.com/avatars/${state.user.id}/${state.user.avatar}.png`;
        if(state.userLvl > 0) {
            document.getElementById('adm-btn-wrap').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:flex-end; margin-left:10px;">
                <span style="font-size:0.5rem; color:var(--accent); font-weight:900;">LVL ${state.userLvl}</span>
                <button onclick="showPage('page-admin')" style="background:var(--accent); border:none; padding:5px 12px; border-radius:6px; color:#000; font-weight:800; cursor:pointer; font-size:0.65rem;">АДМИНКА</button>
            </div>`;
        }
    }

    function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById(id).classList.add('active-page'); }
    function login() { window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CONFIG.discord.clientId}&redirect_uri=${encodeURIComponent(CONFIG.discord.redirectUri)}&response_type=token&scope=identify`; }
    function logout() { localStorage.clear(); location.reload(); }
    window.onload = init;
</script>
</body>
</html>
