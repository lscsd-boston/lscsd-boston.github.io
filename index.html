<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LSCSD Portal</title>
    <link rel="icon" type="image/png" href="image.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg: #03050a;
            --card: #0a0e15;
            --card-hover: #0f141f;
            --accent: #d4a373;
            --accent-light: #e4b98a;
            --border: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --error: #ff4d4d;
            --error-bg: rgba(255, 77, 77, 0.1);
            --success: #4ade80;
            --overlay: rgba(0, 0, 0, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

        #preloader { position: fixed; inset: 0; background: var(--bg); z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .loader-logo { width: 120px; filter: drop-shadow(0 0 30px var(--accent)); margin-bottom: 30px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .loader-bar { width: 200px; height: 3px; background: var(--border); border-radius: 3px; position: relative; overflow: hidden; }
        .loader-progress { position: absolute; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: move 1.5s infinite linear; border-radius: 3px; }
        @keyframes move { from { left: -50%; } to { left: 110%; } }

        header { display: none; justify-content: space-between; align-items: center; padding: 0 5%; height: 80px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(3, 5, 10, 0.9); backdrop-filter: blur(20px); z-index: 1000; }
        .header-right { display: flex; align-items: center; gap: 12px; }

        .container { display: none; max-width: 1300px; margin: 0 auto; padding: 40px 20px; }
        .page { display: none; animation: fadeIn 0.4s ease forwards; }
        .page.active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 45px 25px; border-radius: 20px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3); }
        .card-emoji { font-size: 3.5rem; margin-bottom: 15px; position: relative; z-index: 1; }
        .card-title { font-weight: 800; text-transform: uppercase; letter-spacing: 1px; position: relative; z-index: 1; }

        .u-input { width: 100%; padding: 16px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; color: var(--text); outline: none; margin-bottom: 8px; font-size: 0.95rem; transition: all 0.3s ease; resize: vertical; }
        .u-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.1); }
        .u-input.error { border-color: var(--error); box-shadow: 0 0 0 3px var(--error-bg); }
        textarea.u-input { min-height: 80px; }
        input[type="color"].u-input { padding: 8px 20px; height: 50px; cursor: pointer; }

        .btn { padding: 14px 28px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s ease; font-size: 0.95rem; letter-spacing: 0.5px; }
        .btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #000; }
        .btn-accent:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212, 163, 115, 0.3); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); background: rgba(212, 163, 115, 0.05); }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-sm { padding: 10px 18px; font-size: 0.8rem; border-radius: 10px; }
        .btn-block { width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        .opt-btn { padding: 18px 20px; background: var(--card); border: 2px solid var(--border); border-radius: 14px; color: var(--text); cursor: pointer; text-align: center; font-weight: 700; font-size: 0.9rem; transition: all 0.3s ease; }
        .opt-btn:hover { border-color: var(--accent); background: var(--card-hover); }
        .opt-btn.active { border-color: var(--accent); background: rgba(212, 163, 115, 0.15); color: var(--accent); box-shadow: 0 0 20px rgba(212, 163, 115, 0.15); }

        .admin-layout { display: grid; grid-template-columns: 340px 1fr; gap: 25px; align-items: start; }
        .admin-sidebar { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .cat-item { padding: 16px 18px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        .cat-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.04); }
        .admin-editor { background: var(--card); padding: 35px; border-radius: 20px; border: 1px solid var(--border); min-height: 400px; }

        label { display: block; font-size: 0.75rem; color: var(--accent); font-weight: 700; text-transform: uppercase; margin: 20px 0 8px; letter-spacing: 1.5px; }
        label:first-child { margin-top: 0; }

        #modal-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 10000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); padding: 20px; }
        .modal-box { background: var(--card); border: 1px solid var(--border-light); padding: 35px; border-radius: 24px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; border-top: 4px solid var(--accent); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-title { font-weight: 900; margin-bottom: 10px; font-size: 1.5rem; }
        .modal-text { color: var(--text-dim); margin-bottom: 25px; font-size: 0.9rem; line-height: 1.5; }
        .modal-extra { margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .login-page { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--card); padding: 50px 40px; border-radius: 30px; border: 1px solid var(--border); text-align: center; max-width: 420px; width: 100%; }
        .login-logo { width: 90px; margin-bottom: 25px; filter: drop-shadow(0 0 25px var(--accent)); }

        .toast { position: fixed; bottom: 30px; right: 30px; z-index: 99999; padding: 16px 24px; border-radius: 12px; font-weight: 600; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .toast-success { background: var(--success); color: #000; }
        .toast-error { background: var(--error); color: #fff; }

        .log-entry { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .log-entry:last-child { border-bottom: none; }
        .log-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.7rem; margin-right: 8px; }
        .log-type-INFO { background: #06b6d4; color: #000; }
        .log-type-SUCCESS { background: #22c55e; color: #000; }
        .log-type-WARN { background: #eab308; color: #000; }
        .log-type-ERROR { background: #ef4444; color: #fff; }
        .log-type-SUBMIT { background: #a855f7; color: #fff; }
        .log-type-ADMIN { background: #3b82f6; color: #fff; }
        .log-type-BUG { background: #f59e0b; color: #000; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    </style>
</head>
<body>

    <div id="preloader">
        <img src="image.png" class="loader-logo" alt="LSCSD">
        <div class="loader-bar"><div class="loader-progress"></div></div>
    </div>

    <div id="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-text" id="modal-text"></div>
            <div class="modal-extra" id="modal-extra"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div id="page-login" class="login-page" style="display:none;">
        <div class="login-card">
            <img src="image.png" class="login-logo" alt="LSCSD">
            <h2 style="margin-bottom:10px;font-weight:900;font-size:1.8rem;">LSCSD PORTAL</h2>
            <p style="color:var(--text-dim);margin-bottom:30px;">Портал подачи заявок</p>
            <button class="btn btn-block" style="background:#5865F2;color:#fff;font-size:1rem;" onclick="login()">🔐 Войти через Discord</button>
        </div>
    </div>

    <header id="ui-header">
        <img src="image.png" style="height:45px;cursor:pointer;" onclick="showPage('page-home')" alt="Home">
        <div class="header-right">
            <button class="btn btn-outline btn-sm" onclick="openBug()">🐛 Баг-репорт</button>
            <div id="adm-btn-wrap"></div>
            <img id="u-ava" style="width:42px;border-radius:50%;border:2px solid var(--accent);cursor:pointer;" onclick="logout()" alt="User">
        </div>
    </header>

    <div class="container" id="main-container">
        
        <div id="page-home" class="page active-page">
            <h1 style="margin-bottom:10px;font-weight:900;font-size:2.2rem;">📋 Доступные заявки</h1>
            <p style="color:var(--text-dim);margin-bottom:35px;">Выберите форму для заполнения</p>
            <div id="grid-main" class="grid"></div>
        </div>

        <div id="page-apply" class="page">
            <div style="background:var(--card);padding:40px;border-radius:24px;border:1px solid var(--border);">
                <button class="btn btn-outline btn-sm" onclick="showPage('page-home')" style="margin-bottom:25px;">← НАЗАД К ФОРМАМ</button>
                <h2 id="apply-title" style="font-weight:900;font-size:1.8rem;margin-bottom:30px;"></h2>
                <div id="dept-selector" style="display:none;margin-bottom:30px;">
                    <label id="dept-label"></label>
                    <div id="dept-btns" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"></div>
                </div>
                <div id="apply-fields"></div>
                <button id="submit-btn" class="btn btn-accent btn-block" style="margin-top:20px;font-size:1rem;" onclick="submitApp()">📨 ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>

        <div id="page-admin" class="page">
            <div class="admin-layout">
                <div class="admin-sidebar">
                    <label style="margin-top:0;">📂 ФОРМЫ</label>
                    <div id="admin-cat-list"></div>
                    <button class="btn btn-accent btn-block btn-sm" onclick="addForm()">+ СОЗДАТЬ ФОРМУ</button>
                    
                    <div id="owner-tools" style="display:none;margin-top:25px;padding-top:25px;border-top:1px solid var(--border);">
                        <label style="margin-top:0;">⚙️ УПРАВЛЕНИЕ</label>
                        <button class="btn btn-outline btn-block btn-sm" style="margin-bottom:8px;" onclick="manageAdmins()">👥 Администраторы</button>
                        <button class="btn btn-outline btn-block btn-sm" style="margin-bottom:8px;" onclick="manageLvls()">🏷️ Названия уровней</button>
                        <button class="btn btn-outline btn-block btn-sm" onclick="viewLogs()">📋 Логи системы</button>
                    </div>
                </div>
                <div class="admin-editor" id="admin-editor">
                    <div style="text-align:center;color:var(--text-dim);margin-top:80px;">
                        <div style="font-size:4rem;margin-bottom:20px;">📝</div>
                        <p>Выберите форму слева для редактирования</p>
                        <p style="font-size:0.8rem;">или создайте новую</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

<script>
    const API_BASE = 'https://meri-server.64.188.66.210.nip.io';
    
    const state = {
        user: null,
        cats: [],
        activeCat: null,
        selDept: null,
        userLevel: 0,
        lvlNames: []
    };

    function toast(msg, type = 'success') {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    async function init() {
        const hash = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);
        let token = params.get('access_token') || localStorage.getItem('sd_token');
        if (token) {
            window.location.hash = '';
            localStorage.setItem('sd_token', token);
            try {
                const res = await fetch(`${API_BASE}/api/user/me`, { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) throw new Error('Invalid token');
                const data = await res.json();
                state.user = data;
                state.userLevel = data.level;
                state.lvlNames = data.lvlNames || [];
                await loadCategories();
                document.getElementById('ui-header').style.display = 'flex';
                document.getElementById('main-container').style.display = 'block';
                renderHeader();
                document.getElementById('preloader').style.opacity = '0';
